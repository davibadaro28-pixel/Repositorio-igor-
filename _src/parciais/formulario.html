        <form class="form-curto" id="form-entrar" novalidate>
          <div class="form-grade">
            <div class="campo">
              <label for="f-nome">Nome</label>
              <input id="f-nome" name="nome" type="text" autocomplete="given-name" required>
            </div>
            <div class="campo">
              <label for="f-whats">WhatsApp</label>
              <input id="f-whats" name="whatsapp" type="tel" inputmode="tel" autocomplete="tel" placeholder="(11) 90000-0000" required>
            </div>
          </div>
          <fieldset class="campo-grupo">
            <legend>Fase atual</legend>
            <div class="opcoes">
              <label class="opcao"><input type="radio" name="fase" value="gestacao" required> Gestação</label>
              <label class="opcao"><input type="radio" name="fase" value="pos"> Pós-parto</label>
            </div>
          </fieldset>
          <div class="campo" data-se="gestacao" hidden>
            <label for="f-semana">Semana gestacional</label>
            <input id="f-semana" name="semana" type="text" inputmode="numeric" autocomplete="off" placeholder="Ex.: 18">
          </div>
          <div class="campo" data-se="pos" hidden>
            <label for="f-tempo">Há quanto tempo foi o parto?</label>
            <select id="f-tempo" name="tempo">
              <option value="">Escolha uma opção</option>
              <option>Menos de 6 semanas</option>
              <option>Entre 6 semanas e 3 meses</option>
              <option>Entre 3 e 6 meses</option>
              <option>Mais de 6 meses</option>
            </select>
          </div>
          <div class="campo">
            <label for="f-interesse">Principal interesse</label>
            <select id="f-interesse" name="interesse" required>
              <option value="">Escolha uma opção</option>
              <option>Ganho de peso na gestação</option>
              <option>Alimentação e nutrientes na gestação</option>
              <option>Enjoo, azia ou outros desconfortos</option>
              <option>Alimentação na amamentação</option>
              <option>Recuperação no pós-parto</option>
              <option>Ganho de massa muscular depois do parto</option>
              <option>Conhecer o programa</option>
            </select>
          </div>
          <p class="form-erro" id="form-erro" role="alert" hidden></p>
          <button class="botao" type="submit"><svg class="icone-cheio" aria-hidden="true"><use href="#i-whatsapp"/></svg>Continuar no WhatsApp</button>
          <p class="form-nota">As respostas vão apenas na mensagem para a Bea. Nada fica salvo neste site.</p>
        </form>
        <div class="form-pronto" id="form-pronto" tabindex="-1" hidden>
          <p class="form-pronto-titulo">Sua mensagem está pronta.</p>
          <p>Se o WhatsApp não abriu sozinho, <a class="js-enviar" href="https://wa.me/5511945364807" rel="noopener">toque aqui para abrir a conversa</a>.</p>
        </div>
